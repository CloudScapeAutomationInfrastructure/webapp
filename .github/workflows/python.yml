name: Python Application CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306

    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python environment (specify Python version)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12" # Specify the Python version you're using

      # Step 3: Install dependencies (requirements.txt should be present in your repo)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Set environment variables for MySQL connection (DATABASE_URL should be set to MySQL)
      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=mysql+pymysql://test_user:test_password@127.0.0.1:3306/test_db" >> $GITHUB_ENV
          echo "SECRET_KEY=mysecretkey" >> $GITHUB_ENV

      # Step 5: Start the Flask application (optional, if needed)
      - name: Start the Flask application
        run: |
          nohup python app.py &
        env:
          FLASK_ENV: development
          DATABASE_URL: ${{ env.DATABASE_URL }} # MySQL connection URL

      # Step 6: Run pytest to ensure tests pass
      - name: Run pytest
        run: |
          pytest --disable-warnings
