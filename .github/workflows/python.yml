name: Python Application CI with MySQL and Packer

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Run Python Tests with MySQL and Validate Packer
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV

      - name: Run pytest
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}  # Ensure AWS_REGION is available for tests
        run: |
          pytest test_app.py --disable-warnings

      - name: Run Packer init
        run: |
          cd aws-packer
          packer init .

      - name: Run Packer validate
        run: |
          cd aws-packer
          packer validate .
