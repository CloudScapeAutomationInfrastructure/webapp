name: Python Application CI with MySQL and Packer

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build-packer-image:
    name: Build Packer Custom Image
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up environment variables
        run: |
          echo "TEST_ENV=true" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> $GITHUB_ENV
          echo "SNS_TOPIC_ARN=${{ secrets.SNS_TOPIC_ARN }}" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/api
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > ${GITHUB_WORKSPACE}/api/.env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> ${GITHUB_WORKSPACE}/api/.env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> ${GITHUB_WORKSPACE}/api/.env
          echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> ${GITHUB_WORKSPACE}/api/.env
          echo "SNS_TOPIC_ARN=${{ secrets.SNS_TOPIC_ARN }}" >> ${GITHUB_WORKSPACE}/api/.env
          

      - name: Run pytest
        run: |
          pytest test_app.py --disable-warnings

      - name: Install Packer
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          sudo apt-get update && sudo apt-get install packer

      - name: Run Packer init
        run: |
          cd aws-packer
          packer init .

      - name: Build Packer image
        run: |
            cd aws-packer
            packer build -var "envfile=${GITHUB_WORKSPACE}/api/.env" aws.pkr.hcl | tee packer_build.log
        

      - name: Configure AWS credentials for demo account
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEMO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEMO }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Launch Template
        id: update-launch-template
        run: |
            # Get the AMI ID from the Packer output
            AMI_ID=$(grep -oP '(?<=AMI:)[a-zA-Z0-9-]+' aws-packer/packer_build.log)
            echo "AMI_ID=$AMI_ID" >> $GITHUB_ENV
            
            # Validate AMI ID format
            if [[ ! $AMI_ID =~ ^ami-[a-z0-9]{8,17}$ ]]; then
              echo "Error: Invalid AMI ID format: $AMI_ID"
              exit 1
            fi
            
            # Get the name of the Launch Template
            LAUNCH_TEMPLATE_NAME=$(aws ec2 describe-launch-templates --query "LaunchTemplates[0].LaunchTemplateName" --output text)
            echo "LAUNCH_TEMPLATE_NAME=$LAUNCH_TEMPLATE_NAME" >> $GITHUB_ENV
            
            # Create a new Launch Template version
            aws ec2 create-launch-template-version --launch-template-name "$LAUNCH_TEMPLATE_NAME" --source-version 1 --version-description "New version with AMI $AMI_ID" --launch-template-data "{\"ImageId\":\"$AMI_ID\"}"
            
            # Get the latest version number
            LATEST_VERSION=$(aws ec2 describe-launch-templates --launch-template-name "$LAUNCH_TEMPLATE_NAME" --query "LaunchTemplates[0].LatestVersionNumber" --output text)
            echo "LATEST_VERSION=$LATEST_VERSION" >> $GITHUB_ENV
            
            # Update the Auto Scaling Group to use the latest Launch Template version
            ASG_NAME=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[0].AutoScalingGroupName" --output text)
            aws autoscaling update-auto-scaling-group --auto-scaling-group-name "$ASG_NAME" --launch-template "{\"LaunchTemplateName\":\"$LAUNCH_TEMPLATE_NAME\",\"Version\":\"$LATEST_VERSION\"}"
  
      - name: Perform Instance Refresh
        id: instance-refresh
        run: |
            ASG_NAME=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[0].AutoScalingGroupName" --output text)
            REFRESH_ID=$(aws autoscaling start-instance-refresh --auto-scaling-group-name "$ASG_NAME" --preferences "{\"MinHealthyPercentage\": 100}" --query "InstanceRefreshId" --output text)
            echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_ENV
  
      - name: Wait for Instance Refresh
        run: |
            ASG_NAME=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[0].AutoScalingGroupName" --output text)
            REFRESH_ID=$(echo $REFRESH_ID)
            STATUS="InProgress"
            while [ "$STATUS" == "InProgress" ]; do
              sleep 30
              STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG_NAME" --instance-refresh-ids "$REFRESH_ID" --query "InstanceRefreshes[0].Status" --output text)
              echo "Instance refresh status: $STATUS"
            done
            if [ "$STATUS" != "Successful" ]; then
              echo "Instance refresh failed!"
              exit 1
            fi