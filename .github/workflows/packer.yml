name: Python Application CI with MySQL and Packer

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build-packer-image:
    name: Build Packer Custom Image
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up environment variables
        run: |
          echo "TEST_ENV=true" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> $GITHUB_ENV
          echo "SNS_TOPIC_ARN=${{ secrets.SNS_TOPIC_ARN }}" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/api
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > ${GITHUB_WORKSPACE}/api/.env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> ${GITHUB_WORKSPACE}/api/.env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> ${GITHUB_WORKSPACE}/api/.env
          echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> ${GITHUB_WORKSPACE}/api/.env
          echo "SNS_TOPIC_ARN=${{ secrets.SNS_TOPIC_ARN }}" >> ${GITHUB_WORKSPACE}/api/.env

      - name: Run pytest
        run: |
          pytest test_app.py --disable-warnings

      - name: Install Packer
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          sudo apt-get update && sudo apt-get install packer

      - name: Run Packer init
        run: |
          cd aws-packer
          packer init .

      - name: Build AMI with Packer
        run: |
          cd aws-packer
          packer build \
            -var "additional_account_id=${{ secrets.DEMO_ACCOUNT }}" \
            -var "envfile=${GITHUB_WORKSPACE}/api/.env" \
            aws.pkr.hcl | tee output.log
          
          # Extract the AMI ID from the Packer output
          AMI_ID=$(grep -oP '(?<=AMI: )[a-zA-Z0-9-]+' output.log)
          if [[ -z "$AMI_ID" ]]; then
            echo "Error: AMI ID could not be extracted from the Packer output."
            exit 1
          fi
          echo "Extracted AMI_ID: $AMI_ID"
          echo "AMI_ID=${AMI_ID}" >> $GITHUB_ENV

      - name: Debug Packer Log
        run: |
          echo "Contents of output.log:"
          cat aws-packer/output.log

      - name: Update Launch Template
        id: update-launch-template
        run: |
          if [[ ! -s aws-packer/output.log ]]; then
            echo "Error: Packer build log is missing or empty."
            exit 1
          fi

          # Extract AMI ID
          AMI_ID=$(grep -oP '(?<=AMI: )[a-zA-Z0-9-]+' aws-packer/output.log)
          if [[ -z "$AMI_ID" ]]; then
            echo "Error: AMI ID could not be extracted from the output log."
            exit 1
          fi
          echo "Extracted AMI_ID: $AMI_ID"
          echo "AMI_ID=${AMI_ID}" >> $GITHUB_ENV

          # Fetch Launch Template Name
          LAUNCH_TEMPLATE_NAME=$(aws ec2 describe-launch-templates --query "LaunchTemplates[0].LaunchTemplateName" --output text 2>&1)
          if [[ $? -ne 0 || -z "$LAUNCH_TEMPLATE_NAME" ]]; then
            echo "Error: Could not fetch launch template name. Check if a launch template exists."
            echo "Debug: AWS CLI output: $LAUNCH_TEMPLATE_NAME"
            exit 1
          fi
          echo "Launch Template Name: $LAUNCH_TEMPLATE_NAME"

          # Create new Launch Template Version
          aws ec2 create-launch-template-version \
            --launch-template-name "$LAUNCH_TEMPLATE_NAME" \
            --source-version 1 \
            --version-description "New version with AMI $AMI_ID" \
            --launch-template-data "{\"ImageId\":\"$AMI_ID\"}" || exit 1

          # Fetch latest version
          LATEST_VERSION=$(aws ec2 describe-launch-templates \
            --launch-template-name "$LAUNCH_TEMPLATE_NAME" \
            --query "LaunchTemplates[0].LatestVersionNumber" --output text 2>&1)
          if [[ $? -ne 0 || -z "$LATEST_VERSION" ]]; then
            echo "Error: Could not fetch the latest version of the launch template."
            echo "Debug: AWS CLI output: $LATEST_VERSION"
            exit 1
          fi
          echo "Latest Version: $LATEST_VERSION"

          # Fetch Auto Scaling Group Name
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[0].AutoScalingGroupName" --output text 2>&1)
          if [[ $? -ne 0 || -z "$ASG_NAME" ]]; then
            echo "Error: Could not fetch auto-scaling group name."
            echo "Debug: AWS CLI output: $ASG_NAME"
            exit 1
          fi
          echo "Auto Scaling Group Name: $ASG_NAME"

          # Update Auto Scaling Group
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" \
            --launch-template "{\"LaunchTemplateName\":\"$LAUNCH_TEMPLATE_NAME\",\"Version\":\"$LATEST_VERSION\"}" || exit 1

      - name: Perform Instance Refresh
        id: instance-refresh
        run: |
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[0].AutoScalingGroupName" --output text)
          REFRESH_ID=$(aws autoscaling start-instance-refresh --auto-scaling-group-name "$ASG_NAME" --preferences "{\"MinHealthyPercentage\": 100}" --query "InstanceRefreshId" --output text)
          echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_ENV

      - name: Wait for Instance Refresh
        run: |
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[0].AutoScalingGroupName" --output text)
          REFRESH_ID=$(echo $REFRESH_ID)
          STATUS="InProgress"
          while [ "$STATUS" == "InProgress" ]; do
            sleep 30
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG_NAME" --instance-refresh-ids "$REFRESH_ID" --query "InstanceRefreshes[0].Status" --output text)
            echo "Instance refresh status: $STATUS"
          done
          if [ "$STATUS" != "Successful" ]; then
            echo "Instance refresh failed!"
            exit 1
          fi
