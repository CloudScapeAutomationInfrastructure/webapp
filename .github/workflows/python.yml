name: Python Application CI with MySQL and Packer

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Run Python Tests with MySQL and Validate Packer
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=mysql+pymysql://test_user:test_password@127.0.0.1:3306/test_db" >> $GITHUB_ENV
          echo "SECRET_KEY=mysecretkey" >> $GITHUB_ENV

      - name: Run Packer fmt
        run: |
          packer fmt -check aws-packer/aws.pkr.hcl

      - name: Run Packer validate
        run: |
          packer validate aws-packer/aws.pkr.hcl

      - name: Start Flask application
        run: |
          nohup python app.py &
        env:
          FLASK_ENV: development
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run pytest
        run: |
          pytest test_app.py --disable-warnings
